[package]
name = "fluentbase-runtime"
version.workspace = true
description.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# fluentbase
fluentbase-types = { workspace = true }
# The local `wasmtime` feature selects the execution backend and adds the Wasmtime half of
# system-runtime admission; without it the crate does not link Wasmtime at all.
rwasm = { workspace = true }
# Reads the export section for the backend-independent entrypoint ABI rule of system-runtime
# admission. It is the parser rwasm validates with, so it adds no new crate to the tree.
wasmparser = { package = "wasmparser-nostd", version = "0.100", default-features = false }

# misc
k256 = { version = "0.13.1", default-features = false, features = ["ecdsa"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
# don't use patched tiny-keccak from workspace
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
blake3 = { workspace = true, default-features = false }
sha2 = { workspace = true, default-features = false }
num = "0.4.3"
sp1-curves = { workspace = true }
bytemuck = { workspace = true }
schnellru = { workspace = true }
metrics = { workspace = true, optional = true }
amcl = { package = "snowbridge-amcl", version = "1.0.2", default-features = false, features = [
    "bls381",
] }

[dev-dependencies]
sha2 = { workspace = true, default-features = false }
rand = "0.9.2"
wat = "1.223.0"

[features]
default = ["std"]
std = [
    "dep:metrics",
    "rwasm/std",
    "fluentbase-types/std",
]
rwasm = []
debug-print = [
    # "rwasm/debug-print",
]
wasmtime = [
    "rwasm/wasmtime",
    # "rwasm/cache-compiled-artifacts",
]
