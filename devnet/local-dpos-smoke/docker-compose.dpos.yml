      - "19103:9100"   # DEVNET commonware registry
      - "19013:9001"   # reth registry / `metrics::` families

  validator-4:
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec /usr/local/bin/fluent node \
