name: fluent-dpos-soak
# GENERATED by gen-soak-compose.sh N=14 — do not edit (gitignored).
networks:
  fluent-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

# IMAGE-only anchor: every service references the SAME pre-built tag. The build
# section lives on genesis-init ALONE (below) so 'docker compose up --build' builds the
# image EXACTLY ONCE (not once per service). genesis-init runs first and everything
# depends_on it (service_completed_successfully), so the image is built+tagged before any
# validator/full-node/downstream starts, and they all reuse fluent-dpos-smoke:local.
# (Previously this anchor carried the build section too, so all ~13 services declared the
# identical build+tag, and up --build ran ~13 SEPARATE Rust compiles → OOM on a cold cache.)
x-fluent-build: &fluent-build
  image: fluent-dpos-smoke:local
  # RUST_LOG_STYLE=never disables the fluent binary's forced-ANSI stdout (the fork
  # defaults ColorMode::Always with no tty detection and overrides even --color always;
  # NO_COLOR is ignored by the fork). Placed in the two build anchors EVERY fluent service
  # merges so a later-added service cannot miss it and emit color that breaks docker-logs
  # machine-parsers. (Non-fluent services: coredns never merges these anchors; genesis-init
  # merges the -def anchor and inherits it harmlessly.)
  environment:
    RUST_LOG_STYLE: "never"
  logging:
    driver: json-file
    options:
      max-size: "64m"
      max-file: "5"

# The SOLE build definition. Merged into genesis-init only.
x-fluent-build-def: &fluent-build-def
  build:
    context: ../..
    dockerfile: devnet/local-dpos-smoke/Dockerfile
  image: fluent-dpos-smoke:local
  environment:
    RUST_LOG_STYLE: "never"
  logging:
    driver: json-file
    options:
      max-size: "64m"
      max-file: "5"

x-cpu-limit: &cpu-limit
  deploy:
    resources:
      limits:
        cpus: "2.0"

x-follower-health: &follower-health
  healthcheck:
    test:
      - "CMD-SHELL"
      - "curl -s -X POST -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"method\":\"eth_blockNumber\",\"params\":[],\"id\":1}' http://localhost:8545 | grep -q result"
    interval: 2s
    timeout: 2s
    retries: 30
    start_period: 5s

services:
  genesis-init:
    <<: *fluent-build-def
    entrypoint: ["/usr/local/bin/genesis-bootstrap"]
    command:
      - bare
      - --peers=20
      - --bootstrappers=2
      - --output=/runtime
      - --chain-id=2026
      - --validator-ips=172.20.0.10,172.20.0.11,172.20.0.12,172.20.0.13,172.20.0.14,172.20.0.15,172.20.0.16,172.20.0.17,172.20.0.18,172.20.0.19,172.20.0.20,172.20.0.21,172.20.0.22,172.20.0.23,172.20.0.24,172.20.0.25,172.20.0.26,172.20.0.27,172.20.0.28,172.20.0.29
      - --peer-host-mode=ip
      # Deployer prefix before DeployStaking's first CREATE occupies nonces 0..4 (fund-spammer,
      # token, + three more), so the hardened DeployStaking's first internal CREATE (BLS12381Verifier)
      # lands at nonce 5 and its proxy CREATEs land at deployer nonces 9/15/19 for
      # staking/chainConfig/liveness (verified against the DeployStaking broadcast: Staking proxy
      # nonce 0x9, ChainConfig proxy 0xf, LivenessSlashing proxy 0x13; the production-path stack
      # has a longer 7-tx prefix → 11/17/21 there). This prediction is now only the PHASE-A
      # PLACEHOLDER that lets sequencer nodes parse --dpos.staking-config at boot; case-soak.sh
      # REGENERATES /runtime/staking-reader.json from the real DeployStaking manifest before the
      # --dpos cold-restart (soak_regen_staking_reader), so a stale/leaked-state nonce drift here
      # is overwritten, not fatal. The file must still EXIST at phase-A boot, so keep this pin.
      - --staking-reader-create-nonces=9,15,19
    volumes:
      - runtime:/runtime
    networks:
      fluent-net:
        ipv4_address: 172.20.0.5

