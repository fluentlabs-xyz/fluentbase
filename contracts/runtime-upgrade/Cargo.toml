[package]
name = "fluentbase-contracts-runtime-upgrade"
version = "0.1.0"
edition = "2021"

[dependencies]
fluentbase-sdk = { workspace = true }

[dev-dependencies]
fluentbase-testing = { workspace = true }
# Independent Solidity ABI decoder used to validate emitted event log data.
alloy-sol-types = { workspace = true }
# Independent reader of the published `abi.json`, to pin it to the router's selectors.
alloy-json-abi = { workspace = true }

[build-dependencies]
fluentbase-build = { workspace = true }

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["fluentbase-sdk/std", "fluentbase-testing/std"]
debug-print = ["fluentbase-sdk/debug-print", "fluentbase-testing/debug-print"]