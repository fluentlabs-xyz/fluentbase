[package]
name = "fluentbase-contracts-staking"
version = "0.1.0"
edition = "2021"

[dependencies]
fluentbase-sdk = { workspace = true }
fluentbase-staking-abi = { workspace = true }

[dev-dependencies]
fluentbase-testing = { workspace = true }

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["fluentbase-sdk/std", "fluentbase-staking-abi/std", "fluentbase-testing/std"]
debug-print = ["fluentbase-sdk/debug-print", "fluentbase-testing/debug-print"]
# Views with no production consumer: `e2e/` and the node repo's devnet
# smoke/soak harness are the only callers. Off by default so the production
# artifact carries no view surface it has nothing in production to serve.
devnet-views = []
