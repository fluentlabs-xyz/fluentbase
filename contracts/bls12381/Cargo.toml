[package]
name = "fluentbase-contracts-bls12381"
version = "0.1.0"
edition = "2021"

[dependencies]
fluentbase-sdk = { workspace = true }
#bls12_381 = { git = "https://github.com/rwasm-patches/bls12_381.git", branch = "rwasm", default-features = false, features = ["groups", "alloc", "pairings"] }
revm-precompile = { workspace = true }
fluentbase-crypto = { workspace = true, features = ["revm-precompile"] }

[dev-dependencies]
fluentbase-testing = { workspace = true }
serde = "1.0.228"
serde_json = "1.0.145"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["std"]
std = ["fluentbase-sdk/std", "revm-precompile/std", "fluentbase-testing/std", "fluentbase-crypto/std"]
debug-print = ["fluentbase-sdk/debug-print", "fluentbase-testing/debug-print"]