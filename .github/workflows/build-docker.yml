name: Build Docker Image (Fluentbase)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      docker_tag:
        description: "Custom Docker image tag (e.g., v0.3.7-dev)"
        required: true
      branch:
        description: "Branch to use for SDK build (optional if tag is used)"
        required: false
      push_latest:
        description: "Also tag as latest"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/fluentbase-build
  RUST_TOOLCHAIN: 1.93.1

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate release tag
        id: tag
        if: ${{ github.ref_type == 'tag' }}
        # Tag pushes publish a public image tag and may advance `latest`, so the
        # tag must be canonical (v<workspace-version> or v<workspace-version>-rc.N).
        # Emits channel=stable|prerelease; only `stable` may move `latest`.
        run: ./.github/scripts/check-release-tag.sh "${GITHUB_REF_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        shell: bash
        # All ${{ }} values are passed through env and referenced as quoted shell
        # vars. GitHub substitutes ${{ }} as raw text BEFORE the shell runs, so
        # interpolating free-form inputs (docker_tag, branch) or refs (ref_name)
        # directly into run: allows shell injection. env: avoids that.
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          GH_SHA: ${{ github.sha }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_TYPE: ${{ github.ref_type }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_DOCKER_TAG: ${{ inputs.docker_tag }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
          TAG_CHANNEL: ${{ steps.tag.outputs.channel }}
        run: |
          set -euo pipefail

          SHA_SHORT=$(echo "${GH_SHA}" | cut -c1-7)
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          EVENT="${GH_EVENT_NAME}"
          REF_TYPE="${GH_REF_TYPE}"
          REF_NAME="${GH_REF_NAME}"

          # --- Determine version and SDK args ---
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
          VERSION="${INPUT_DOCKER_TAG}"
          if [[ -n "${INPUT_BRANCH}" ]]; then
              SDK_VERSION_BRANCH="${INPUT_BRANCH}"
              SDK_VERSION_TAG=""
          else
              SDK_VERSION_BRANCH=""
              SDK_VERSION_TAG="${VERSION}"
          fi
          elif [[ "$REF_TYPE" == "tag" ]]; then
          VERSION="$REF_NAME"
          SDK_VERSION_BRANCH=""
          SDK_VERSION_TAG="${VERSION}"
          else
          VERSION="dev-${SHA_SHORT}"
          SDK_VERSION_BRANCH="${REF_NAME}"
          SDK_VERSION_TAG=""
          fi
          
          IS_RC=false
          if [[ "$VERSION" == *-rc* ]]; then
          IS_RC=true
          fi

          # `latest` moves only for the canonical stable tag (channel=stable,
          # emitted by check-release-tag.sh) or an explicit non-rc dispatch.
          PUSH_LATEST=false
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
          if [[ "$IS_RC" != "true" && "${INPUT_PUSH_LATEST}" == "true" ]]; then
          PUSH_LATEST=true
          fi
          elif [[ "$REF_TYPE" == "tag" && "${TAG_CHANNEL}" == "stable" ]]; then
          PUSH_LATEST=true
          fi
          TAGS="${IMAGE}:${VERSION}"
          if [[ "$PUSH_LATEST" == "true" ]]; then
          TAGS+=",${IMAGE}:latest"
          fi
          
          {
          echo "tags=${TAGS}"
          echo "version=${VERSION}"
          echo "sdk_version_branch=${SDK_VERSION_BRANCH}"
          echo "sdk_version_tag=${SDK_VERSION_TAG}"
          } >> "$GITHUB_OUTPUT"
          
          echo "Resolved metadata:"
          echo "  VERSION=${VERSION}"
          echo "  IS_RC=${IS_RC}"
          echo "  PUSH_LATEST=${PUSH_LATEST}"
          echo "  BRANCH=${SDK_VERSION_BRANCH}"
          echo "  TAG=${SDK_VERSION_TAG}"
          echo "  TAGS=${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./
          file: ./docker/Dockerfile.build
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.title=Fluent Reproducible Build Environment
            org.opencontainers.image.description=Pre-warmed Docker image for reproducible cross-platform builds of Fluent smart contracts
            xyz.fluent.sdk.version=${{ steps.meta.outputs.version }}
            xyz.fluent.rust.toolchain=${{ env.RUST_TOOLCHAIN }}
          build-args: |
            RUST_TOOLCHAIN=${{ env.RUST_TOOLCHAIN }}
            SDK_VERSION_BRANCH=${{ steps.meta.outputs.sdk_version_branch }}
            SDK_VERSION_TAG=${{ steps.meta.outputs.sdk_version_tag }}
          no-cache: true

      - name: Inspect image
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REGISTRY: ${{ env.REGISTRY }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}"

      - name: Print summary
        env:
          GH_SHA: ${{ github.sha }}
          RUST_TOOLCHAIN: ${{ env.RUST_TOOLCHAIN }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "### 🚀 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | \`linux/amd64\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Rust** | \`${RUST_TOOLCHAIN}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SDK Version** | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${GH_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Available tags:**" >> $GITHUB_STEP_SUMMARY
          IFS=',' read -ra TAG_ARRAY <<< "${TAGS}"
          for tag in "${TAG_ARRAY[@]}"; do
            echo "- \`docker pull ${tag}\`" >> $GITHUB_STEP_SUMMARY
          done
