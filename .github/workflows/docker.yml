# Publishes the Docker image.

name: Docker (Fluent)

on:
  push:
    tags:
      - v*

env:
  IMAGE_NAME: ${{ github.repository_owner }}/fluent
  CARGO_TERM_COLOR: always
  DOCKER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fluent
  DOCKER_USERNAME: ${{ github.actor }}
  RUST_TOOLCHAIN: "1.93.1"
  CROSS_REV: "64b5bb4d3d34de062552b9a2093affe77b4ad16a"
  BINFMT_IMAGE: "tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0"
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CC: clang
  CXX: clang++

jobs:
  check-version:
    name: check release tag
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate release tag
        id: tag
        # Both build jobs depend on this gate: only the canonical
        # v<workspace-version> tag (channel=stable) may advance the public
        # `latest` image, and only v<workspace-version>-rc.N builds an rc image.
        run: ./.github/scripts/check-release-tag.sh "${GITHUB_REF_NAME}"

  build-rc:
    needs: check-version
    if: ${{ needs.check-version.outputs.channel == 'prerelease' }}
    name: build and push as release candidate
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: "Build and push fluent image"
            command: "make IMAGE_NAME=$IMAGE_NAME DOCKER_IMAGE_NAME=$DOCKER_IMAGE_NAME PROFILE=maxperf docker-build-push"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: Install cross main
        id: cross_main
        run: |
          cargo +${RUST_TOOLCHAIN} install cross --git https://github.com/cross-rs/cross --rev ${CROSS_REV} --locked
      - name: Log in to Docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username ${DOCKER_USERNAME} --password-stdin
      - name: Set up Docker builder
        run: |
          docker run --privileged --rm "${BINFMT_IMAGE}" --install arm64,amd64
          docker buildx create --use --name cross-builder
      - name: Build and push ${{ matrix.build.name }}
        run: ${{ matrix.build.command }}

  build:
    needs: check-version
    if: ${{ needs.check-version.outputs.channel == 'stable' }}
    name: build and push as latest
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: "Build and push fluent image"
            command: "make IMAGE_NAME=$IMAGE_NAME DOCKER_IMAGE_NAME=$DOCKER_IMAGE_NAME PROFILE=maxperf docker-build-push-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: Install cross main
        id: cross_main
        run: |
          cargo +${RUST_TOOLCHAIN} install cross --git https://github.com/cross-rs/cross --rev ${CROSS_REV} --locked
      - name: Log in to Docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username ${DOCKER_USERNAME} --password-stdin
      - name: Set up Docker builder
        run: |
          docker run --privileged --rm "${BINFMT_IMAGE}" --install arm64,amd64
          docker buildx create --use --name cross-builder
      - name: Install clang and build tools
        run: |
          sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config
      - name: Build and push ${{ matrix.build.name }}
        run: ${{ matrix.build.command }}
