name: Test

on:
  push:
    branches: [ main, devel, "release/*" ]
    paths-ignore: [ "**.md", "docs/**" ]
  pull_request:
    branches: [ main, devel, "release/*" ]
    paths-ignore: [ "**.md", "docs/**" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep CARGO_HOME/RUSTUP_HOME runner-configurable (for persistent Docker volumes).
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CARGO_INCREMENTAL: "0"
  CC: clang
  CXX: clang++

jobs:
  release-supply-chain:
    name: Release supply-chain guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check release workflow hardening
        run: ./.github/scripts/check-release-supply-chain.sh .github/workflows/release.yml
      - name: Authenticate built-in genesis assets
        run: bash ./.github/scripts/verify-built-in-genesis.sh

  tests:
    name: Tests (${{ matrix.name }})
    # Self-hosted runners are persistent and shared with the jobs that publish the builder
    # image, so code from a fork must never execute on them. A fork pull request runs only the
    # GitHub-hosted guard job above; a maintainer pushes the branch to this repository to run
    # the full suite.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------------------------
          # contracts/examples unit tests
          # ---------------------------
          - name: contracts / std
            manifest: ./contracts/Cargo.toml
            features: std
            kind: workspace
            cache-key: contracts-std

          - name: examples / std
            manifest: ./examples/Cargo.toml
            features: std
            kind: workspace
            cache-key: examples-std

          # ---------------------------
          # root e2e (workspace)
          # ---------------------------
          - name: root e2e / std,wasmtime
            manifest: ./Cargo.toml
            features: std,wasmtime
            kind: workspace
            cache-key: root-e2e-std-wasmtime

          - name: root e2e / std
            manifest: ./Cargo.toml
            features: std
            kind: workspace
            cache-key: root-e2e-std
            # Doctests are not sharded across the matrix - one entry owns them.
            doctests: true

          # ---------------------------
          # Complete supported Ethereum state-test corpus
          # ---------------------------
          - name: evm-e2e / std
            manifest: ./e2e/evm/Cargo.toml
            features: std
            kind: evm-e2e
            cache-key: evm-e2e-std

          - name: evm-e2e / std,wasmtime
            manifest: ./e2e/evm/Cargo.toml
            features: std,wasmtime
            kind: evm-e2e
            cache-key: evm-e2e-std-wasmtime

          # ---------------------------
          # evm-e2e suite (fixture)
          # ---------------------------
          - name: fixture / std
            manifest: ./e2e/evm/Cargo.toml
            features: std
            kind: fixture
            cache-key: fixture-std

          - name: fixture / std,wasmtime
            manifest: ./e2e/evm/Cargo.toml
            features: std,wasmtime
            kind: fixture
            cache-key: fixture-std-wasmtime

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install clang and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config python3 curl

      - name: Install Node.js for fixture generation
        if: matrix.kind == 'evm-e2e'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Speed up git fetches
        run: git config --global net.git-fetch-with-cli true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - name: Install wasm32 target
        run: rustup target list --installed | grep -q '^wasm32-unknown-unknown$' || rustup target add wasm32-unknown-unknown

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Rust cache (registries + git)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: false
          cache-all-crates: true
          cache-workspace-crates: true
          cache-on-failure: true
          # Critical: avoid cross-feature stale artifacts ("works once until cargo clean")
          shared-key: tests-${{ matrix.cache-key }}

      - name: Prefetch deps (root)
        run: cargo fetch --locked

      - name: Prefetch deps (evm-e2e)
        if: matrix.kind == 'evm-e2e'
        working-directory: e2e/evm
        run: cargo fetch --locked

      - name: Install nextest
        run: cargo install cargo-nextest@0.9.130 --locked

      - name: Sync ethereum tests (evm-e2e)
        if: matrix.kind == 'evm-e2e'
        working-directory: e2e/evm
        run: |
          make sync_tests
          node gen_tests.js --check
          node --test tests_tools/test_generator.mjs
          python3 -m unittest discover -s tests_tools -v

      - name: Run tests (workspace manifests)
        if: matrix.kind == 'workspace'
        run: |
          set -euxo pipefail
          cargo nextest run \
            --manifest-path="${{ matrix.manifest }}" \
            --workspace \
            --release \
            --no-default-features \
            --features "${{ matrix.features }}" \
            --no-fail-fast \
            --locked

      # nextest does not run doctests, so a `compile_fail` doctest - the codec uses one to pin
      # that a fixed-bytes type wider than bytes32 cannot be instantiated for the Solidity ABI -
      # is not covered by the step above. Kept as its own step so a failure reads as "doctests".
      - name: Run doctests (codec)
        if: matrix.doctests
        run: |
          set -euxo pipefail
          cargo test --doc \
            --manifest-path=./Cargo.toml \
            --package fluentbase-codec \
            --release \
            --no-default-features \
            --features "${{ matrix.features }}" \
            --locked

      - name: Run ethereum tests (evm-e2e)
        if: matrix.kind == 'evm-e2e'
        run: |
          set -euxo pipefail
          cargo nextest run \
            --manifest-path="${{ matrix.manifest }}" \
            --release \
            --no-default-features \
            --features "${{ matrix.features }}" \
            --package evm-e2e \
            --bin evm-e2e \
            --locked \
            --success-output final \
            -E 'test(tests::osaka::) | test(good_coverage_tests) | test(selection_tests) | test(state::tests) | test(exclusions::tests)'

      - name: Run ethereum tests (fixture)
        if: matrix.kind == 'fixture'
        run: |
          set -euxo pipefail
          cargo nextest run \
            --manifest-path="${{ matrix.manifest }}" \
            --release \
            --no-default-features \
            --features "${{ matrix.features }}" \
            --package evm-e2e \
            --bin evm-e2e \
            fixture

      - name: Show sccache stats
        run: ${SCCACHE_PATH} --show-stats

  rust-fmt-lint:
    name: Lint
    runs-on: self-hosted
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Speed up git fetches
        run: git config --global net.git-fetch-with-cli true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install wasm32 target
        run: rustup target list --installed | grep -q '^wasm32-unknown-unknown$' || rustup target add wasm32-unknown-unknown

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Rust cache (registries + git)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: false
          cache-all-crates: true
          cache-workspace-crates: true
          cache-on-failure: true

      - name: Run fmt
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true
