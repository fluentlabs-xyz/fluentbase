name: Publish to crates.io

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (verify without publishing)"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.93.1"

jobs:
  publish:
    name: Publish to crates.io
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || (github.ref_type == 'tag' && !contains(github.ref_name, '-')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify canonical release tag
        # crates.io publishing is irreversible, so only the exact canonical
        # stable tag v<workspace-version> may publish. A workflow_dispatch dry
        # run from a non-tag ref has no tag to validate and publishes nothing.
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Not a tag ref; skipping tag validation (dry run only)"
            exit 0
          fi
          channel="$(./.github/scripts/check-release-tag.sh "${GITHUB_REF_NAME}")"
          echo "$channel"
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" && "$channel" != "channel=stable" ]]; then
            echo "crates.io publishing requires the canonical stable release tag" >&2
            exit 1
          fi

      - name: Publish to crates.io
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --locked -p fluentbase-codec-derive
          cargo search fluentbase-codec-derive | head
          cargo publish --locked -p fluentbase-codec
          cargo search fluentbase-codec | head
          cargo publish --locked -p fluentbase-types
          cargo search fluentbase-types | head
          cargo publish --locked -p fluentbase-runtime
          cargo search fluentbase-runtime | head
          cargo publish --locked -p fluentbase-crypto
          cargo search fluentbase-crypto | head
          cargo publish --locked -p fluentbase-sdk-derive-core
          cargo search fluentbase-sdk-derive-core | head
          cargo publish --locked -p fluentbase-sdk-derive
          cargo search fluentbase-sdk-derive | head
          cargo publish --locked -p fluentbase-sdk
          cargo search fluentbase-sdk | head
